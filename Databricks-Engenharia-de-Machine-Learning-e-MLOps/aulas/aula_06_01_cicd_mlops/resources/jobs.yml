resources:
  jobs:
    carga_produtiva_monitoramento:
      name: "[${bundle.target}] Carga Produtiva e Monitoramento"

      max_concurrent_runs: 1

      parameters:
        - name: data_inicio
          default: "20260501"

        - name: data_fim
          default: "20260601"

        - name: features
          default: "renda_mensal_k,tempo_medio_clique_segundos"

        - name: target
          default: "comprou_eletronico"

        - name: gravar
          default: "true"

        - name: catalogo
          default: "${var.catalogo_destino}"

        - name: esquema
          default: "default"

      tasks:

        - task_key: carga_prod
          environment_key: ml_env
          notebook_task:
            notebook_path: ../notebooks/aula_5_2_job_dados_prod_aprimorado.ipynb

        - task_key: monitoramento_drift
          depends_on:
            - task_key: carga_prod
          environment_key: ml_env
          notebook_task:
            notebook_path: ../notebooks/aula_5_2_job_monitoramento_drift_aprimorado.ipynb

        - task_key: verificar_drift
          depends_on:
            - task_key: monitoramento_drift
          environment_key: ml_env
          notebook_task:
            notebook_path: ../notebooks/verificar_drift_dab.ipynb

        - task_key: condicao_drift
          depends_on:
            - task_key: verificar_drift
          condition_task:
            op: GREATER_THAN
            left: "{{tasks.verificar_drift.values.total_drift}}"
            right: "0"

        - task_key: re_treino
          depends_on:
            - task_key: condicao_drift
              outcome: "true"
          environment_key: ml_env
          notebook_task:
            notebook_path: ../notebooks/aula_5_5_re_treino_dab.ipynb

      environments:
        - environment_key: ml_env
          spec:
            environment_version: "2"
            dependencies:
              - pandas
              - numpy
              - scipy
              - scikit-learn
              - lightgbm
              - mlflow
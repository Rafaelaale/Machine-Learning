resources:
  jobs:
    pipeline_completo_mlops:
      name: "${bundle.target}_pipeline_completo_mlops"

      tasks:
        - task_key: ingestao_dados
          notebook_task:
            notebook_path: ../notebooks/01_ingestao_dados.py
            base_parameters:
              env_catalog: "${var.env_catalog}"
            source: WORKSPACE
          environment_key: Default

        - task_key: pre_processamento
          depends_on:
            - task_key: ingestao_dados
          notebook_task:
            notebook_path: ../notebooks/02_pre_processamento.py
            base_parameters:
              env_catalog: "${var.env_catalog}"
            source: WORKSPACE
          environment_key: Default

        - task_key: treinamento
          depends_on:
            - task_key: pre_processamento
          notebook_task:
            notebook_path: ../notebooks/03_treinamento_modelo.py
            base_parameters:
              env_catalog: "${var.env_catalog}"
            source: WORKSPACE
          environment_key: Default

        - task_key: dados_prod
          depends_on:
            - task_key: treinamento
          notebook_task:
            notebook_path: ../notebooks/04_gerando_dados_produtivos.py
            base_parameters:
              env_catalog: "${var.env_catalog}"
            source: WORKSPACE
          environment_key: Default

        - task_key: monitoramento_drift
          depends_on:
            - task_key: dados_prod
          notebook_task:
            notebook_path: ../notebooks/05_monitoramento_drift.py
            base_parameters:
              env_catalog: "${var.env_catalog}"
              data_inicio: '{{tasks.dados_prod.values.data_inicio}}'
              data_fim: '{{tasks.dados_prod.values.data_fim}}'
            source: WORKSPACE
          environment_key: Default

        - task_key: check_re_treino
          depends_on:
            - task_key: monitoramento_drift
          condition_task:
            op: EQUAL_TO
            left: '{{tasks.monitoramento_drift.values.drift_detectado}}'
            right: 'true'

        - task_key: re_treino_modelo
          depends_on:
            - task_key: check_re_treino
              outcome: 'true'
          notebook_task:
            notebook_path: ../notebooks/06_re_treino.py
            base_parameters:
              env_catalog: "${var.env_catalog}"
              data_inicio: '{{tasks.dados_prod.values.data_inicio}}'
              data_fim: '{{tasks.dados_prod.values.data_fim}}'
            source: WORKSPACE
          environment_key: Default

        - task_key: deploy_modelo
          depends_on:
            - task_key: check_re_treino
              outcome: 'false'
            - task_key: re_treino_modelo
          run_if: AT_LEAST_ONE_SUCCESS
          notebook_task:
            notebook_path: ../notebooks/07_deploy_modelo.py
            base_parameters:
              env_catalog: "${var.env_catalog}"
              data_fim: '{{tasks.dados_prod.values.data_fim}}'
            source: WORKSPACE
          environment_key: Default

      queue:
        enabled: true

      environments:
        - environment_key: Default
          spec:
            environment_version: '5'
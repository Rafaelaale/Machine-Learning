pipelineInfo:
  description: Treina 3 modelos XGBoost por segmento de Amount.
  name: fraude-pipeline
root:
  dag:
    tasks:
      preprocess:
        cachingOptions: {}
        componentRef:
          name: comp-preprocess
        inputs:
          parameters:
            csv_path:
              componentInputParameter: csv_path
            segment:
              runtimeValue:
                constant: low
        taskInfo:
          name: preprocess-low
      preprocess-2:
        cachingOptions: {}
        componentRef:
          name: comp-preprocess-2
        inputs:
          parameters:
            csv_path:
              componentInputParameter: csv_path
            segment:
              runtimeValue:
                constant: medium
        taskInfo:
          name: preprocess-medium
      preprocess-3:
        cachingOptions: {}
        componentRef:
          name: comp-preprocess-3
        inputs:
          parameters:
            csv_path:
              componentInputParameter: csv_path
            segment:
              runtimeValue:
                constant: high
        taskInfo:
          name: preprocess-high
      train-segment:
        cachingOptions: {}
        componentRef:
          name: comp-train-segment
        dependentTasks:
        - preprocess
        inputs:
          artifacts:
            df:
              taskOutputArtifact:
                outputArtifactKey: output_df
                producerTask: preprocess
          parameters:
            eta:
              componentInputParameter: eta
            max_depth:
              componentInputParameter: max_depth
            n_estimators:
              componentInputParameter: n_estimators
            segment:
              runtimeValue:
                constant: low
        taskInfo:
          name: train-low
      train-segment-2:
        cachingOptions: {}
        componentRef:
          name: comp-train-segment-2
        dependentTasks:
        - preprocess-2
        inputs:
          artifacts:
            df:
              taskOutputArtifact:
                outputArtifactKey: output_df
                producerTask: preprocess-2
          parameters:
            eta:
              componentInputParameter: eta
            max_depth:
              componentInputParameter: max_depth
            n_estimators:
              componentInputParameter: n_estimators
            segment:
              runtimeValue:
                constant: medium
        taskInfo:
          name: train-medium
      train-segment-3:
        cachingOptions: {}
        componentRef:
          name: comp-train-segment-3
        dependentTasks:
        - preprocess-3
        inputs:
          artifacts:
            df:
              taskOutputArtifact:
                outputArtifactKey: output_df
                producerTask: preprocess-3
          parameters:
            eta:
              componentInputParameter: eta
            max_depth:
              componentInputParameter: max_depth
            n_estimators:
              componentInputParameter: n_estimators
            segment:
              runtimeValue:
                constant: high
        taskInfo:
          name: train-high
  inputDefinitions:
    parameters:
      csv_path:
        defaultValue: /data/creditcard.csv
        isOptional: true
        parameterType: STRING
      eta:
        defaultValue: 0.1
        isOptional: true
        parameterType: NUMBER_DOUBLE
      max_depth:
        defaultValue: 5.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      n_estimators:
        defaultValue: 200.0
        isOptional: true
        parameterType: NUMBER_INTEGER
schemaVersion: 2.1.0
sdkVersion: kfp-2.15.0
---
platforms:
  kubernetes:
    deploymentSpec:
      executors:
        exec-preprocess:
          pvcMount:
          - constant: dataset-fraude
            mountPath: /data
            pvcNameParameter:
              runtimeValue:
                constant: dataset-fraude
        exec-preprocess-2:
          pvcMount:
          - constant: dataset-fraude
            mountPath: /data
            pvcNameParameter:
              runtimeValue:
                constant: dataset-fraude
        exec-preprocess-3:
          pvcMount:
          - constant: dataset-fraude
            mountPath: /data
            pvcNameParameter:
              runtimeValue:
                constant: dataset-fraude

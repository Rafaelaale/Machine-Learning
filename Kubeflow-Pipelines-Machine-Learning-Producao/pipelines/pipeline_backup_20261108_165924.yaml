# PIPELINE DEFINITION
# Name: fraude-pipeline
# Description: Treina 3 modelos XGBoost por segmento de Amount.
# Inputs:
#    csv_path: str [Default: '/data/creditcard.csv']
#    eta: float [Default: 0.1]
#    max_depth: int [Default: 5.0]
#    n_estimators: int [Default: 200.0]
components:
  comp-preprocess:
    executorLabel: exec-preprocess
    inputDefinitions:
      parameters:
        csv_path:
          parameterType: STRING
        segment:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        output_df:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-preprocess-2:
    executorLabel: exec-preprocess-2
    inputDefinitions:
      parameters:
        csv_path:
          parameterType: STRING
        segment:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        output_df:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-preprocess-3:
    executorLabel: exec-preprocess-3
    inputDefinitions:
      parameters:
        csv_path:
          parameterType: STRING
        segment:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        output_df:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-train-segment:
    executorLabel: exec-train-segment
    inputDefinitions:
      artifacts:
        df:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        eta:
          parameterType: NUMBER_DOUBLE
        max_depth:
          parameterType: NUMBER_INTEGER
        n_estimators:
          parameterType: NUMBER_INTEGER
        segment:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        metrics_out:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        model_out:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
  comp-train-segment-2:
    executorLabel: exec-train-segment-2
    inputDefinitions:
      artifacts:
        df:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        eta:
          parameterType: NUMBER_DOUBLE
        max_depth:
          parameterType: NUMBER_INTEGER
        n_estimators:
          parameterType: NUMBER_INTEGER
        segment:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        metrics_out:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        model_out:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
  comp-train-segment-3:
    executorLabel: exec-train-segment-3
    inputDefinitions:
      artifacts:
        df:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        eta:
          parameterType: NUMBER_DOUBLE
        max_depth:
          parameterType: NUMBER_INTEGER
        n_estimators:
          parameterType: NUMBER_INTEGER
        segment:
          parameterType: STRING

      artifacts:
        metrics_out:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        model_out:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-preprocess:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - preprocess
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.15.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef preprocess(\n    csv_path: str,\n    segment: str,\n    output_df:\
          \ Output[Dataset],\n):\n    import pandas as pd\n\n    if segment not in\
          \ (\"low\", \"medium\", \"high\"):\n        raise ValueError(f\"Segmento\
          \ invalido: {segment}\")\n\n    df = pd.read_csv(csv_path)\n\n    q1, q3\
          \ = df[\"Amount\"].quantile([0.25, 0.75])\n\n    bins = [-float(\"inf\"\
          ), q1, q3, float(\"inf\")]\n    labels = [\"low\", \"medium\", \"high\"\
          ]\n\n    df[\"segment\"] = pd.cut(\n        df[\"Amount\"],\n        bins=bins,\n\
          \        labels=labels,\n    )\n\n    seg_df = (\n        df[df[\"segment\"\
          ] == segment]\n        .drop(columns=[\"segment\"])\n        .reset_index(drop=True)\n\
          \    )\n\n    if seg_df.empty:\n        raise ValueError(f\"Segmento vazio:\
          \ {segment}\")\n\n    seg_df.to_csv(output_df.path, index=False)\n\n   \
          \ print(f\"Segmento: {segment}\")\n    print(f\"Linhas: {len(seg_df)}\"\
          )\n    print(f\"Fraudes: {int(seg_df['Class'].sum())}\")\n\n"
        image: fraude-trainer:1.0
        resources:
          cpuLimit: 1.0
          memoryLimit: 1.073741824
          resourceCpuLimit: '1'
          resourceMemoryLimit: 1Gi
    exec-preprocess-2:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - preprocess

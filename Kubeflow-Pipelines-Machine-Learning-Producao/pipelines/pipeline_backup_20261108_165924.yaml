          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_segment(\n    df: Input[Dataset],\n    segment: str,\n\
          \    eta: float,\n    max_depth: int,\n    n_estimators: int,\n    model_out:\
          \ Output[Model],\n    metrics_out: Output[Metrics],\n):\n    import shutil\n\
          \    import tempfile\n    from pathlib import Path\n\n    from src.train\
          \ import train_from_csv\n\n    with tempfile.TemporaryDirectory() as pasta:\n\
          \        caminho_modelo = str(Path(pasta) / \"model.ubj\")\n\n        result\
          \ = train_from_csv(\n            df.path,\n            eta=eta,\n      \
          \      max_depth=max_depth,\n            n_estimators=n_estimators,\n  \
          \          model_out=caminho_modelo,\n        )\n\n        shutil.copyfile(\n\
          \            result.model_path,\n            model_out.path,\n        )\n\
          \n    model_out.metadata[\"framework\"] = \"xgboost\"\n    model_out.metadata[\"\
          segment\"] = segment\n    model_out.metadata[\"format\"] = \"ubj\"\n\n \
          \   for nome, valor in result.val_metrics.items():\n        metrics_out.log_metric(\n\
          \            f\"val_{nome}\",\n            float(valor),\n        )\n\n\
          \    for nome, valor in result.test_metrics.items():\n        metrics_out.log_metric(\n\
          \            f\"test_{nome}\",\n            float(valor),\n        )\n\n\
          \    print(\n        f\"[{segment}] \"\n        f\"val_pr_auc={result.val_metrics['pr_auc']:.4f}\"\
          \n    )\n\n"
        image: fraude-trainer:1.0
        resources:
          cpuLimit: 1.0
          memoryLimit: 1.572864
          resourceCpuLimit: '1'
          resourceMemoryLimit: 1500Mi

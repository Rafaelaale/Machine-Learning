apiVersion: trainer.kubeflow.org/v1alpha1
kind: ClusterTrainingRuntime

metadata:
  name: xgboost-fraude
  labels:
    trainer.kubeflow.org/framework: xgboost

spec:
  mlPolicy:
    numNodes: 1

  template:
    spec:
      replicatedJobs:
        - name: node
          replicas: 1

          template:
            metadata:
              labels:
                trainer.kubeflow.org/trainjob-ancestor-step: trainer

            spec:
              parallelism: 1
              completions: 1
              backoffLimit: 0

              template:
                spec:
                  restartPolicy: Never

                  containers:
                    - name: node
                      image: fraude-trainer:2.3
                      imagePullPolicy: IfNotPresent

                      command:
                        - python
                        - -m
                        - src.train_node

                      volumeMounts:
                        - name: dataset
                          mountPath: /data
                          readOnly: true

                        - name: models
                          mountPath: /models

                      resources:
                        requests:
                          cpu: "1"
                          memory: "2Gi"
                        limits:
                          cpu: "2"
                          memory: "3Gi"

                  volumes:
                    - name: dataset
                      persistentVolumeClaim:
                        claimName: dataset-fraude

                    - name: models
                      persistentVolumeClaim:
                        claimName: models-pvc-kubeflow
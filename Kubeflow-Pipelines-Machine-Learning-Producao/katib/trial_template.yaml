trialTemplate:
  primaryContainerName: training-container

  trialParameters:
    - name: eta
      description: Learning rate
      reference: eta

    - name: maxDepth
      description: Max depth of trees
      reference: max-depth

    - name: nEstimators
      description: Number of boosting rounds
      reference: n-estimators

  trialSpec:
    apiVersion: batch/v1
    kind: Job

    spec:
      backoffLimit: 0

      template:
        spec:
          restartPolicy: Never

          containers:
            - name: training-container
              image: fraude-trainer:2.2
              imagePullPolicy: IfNotPresent

              command:
                - python
                - -m
                - src.train_katib
                - --eta=${trialParameters.eta}
                - --max-depth=${trialParameters.maxDepth}
                - --n-estimators=${trialParameters.nEstimators}

              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1500Mi

              volumeMounts:
                - name: dataset
                  mountPath: /data
                  readOnly: true

          volumes:
            - name: dataset
              persistentVolumeClaim:
                claimName: dataset-fraude

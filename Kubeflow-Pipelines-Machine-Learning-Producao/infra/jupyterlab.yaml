apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyterlab-fraude
  namespace: kubeflow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jupyterlab-fraude
  template:
    metadata:
      labels:
        app: jupyterlab-fraude
    spec:
      containers:
        - name: jupyter
          image: quay.io/jupyter/scipy-notebook:2024-05-27
          command:
            - start-notebook.py
          args:
            - "--ServerApp.token=kubeflow-local"
            - "--ServerApp.allow_remote_access=True"
          ports:
            - containerPort: 8888
          volumeMounts:
            - name: dataset
              mountPath: /data
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
      volumes:
        - name: dataset
          persistentVolumeClaim:
            claimName: dataset-fraude
---
apiVersion: v1
kind: Service
metadata:
  name: jupyterlab-fraude
  namespace: kubeflow
spec:
  selector:
    app: jupyterlab-fraude
  ports:
    - port: 8888
      targetPort: 8888

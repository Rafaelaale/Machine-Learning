apiVersion: v1
kind: Pod
metadata:
  name: dataset-loader
  namespace: kubeflow
  annotations:
    description: "Pod temporario para carregar dataset CSV."
spec:
  containers:
    - name: loader
      image: busybox:1.37
      command: ["sleep", "3600"]
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: dataset-fraude
  restartPolicy: Never

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kfp-aula32-deploy-manager
  namespace: kubeflow
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["fraude-predictor-compat"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kfp-aula32-deploy-manager
  namespace: kubeflow
subjects:
- kind: ServiceAccount
  name: default
  namespace: kubeflow
- kind: ServiceAccount
  name: pipeline-runner
  namespace: kubeflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kfp-aula32-deploy-manager

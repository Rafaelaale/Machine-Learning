apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraude-predictor-compat
  namespace: kubeflow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fraude-predictor-compat
  template:
    metadata:
      labels:
        app: fraude-predictor-compat
    spec:
      containers:
        - name: predictor
          image: fraude-trainer:2.3
          imagePullPolicy: Never
          workingDir: /app
          command:
            - python
            - -m
            - src.server_inferencia_aula31
          ports:
            - containerPort: 8080
          env:
            - name: MODEL_PATH
              value: /models/aula26-20261108210412/model.ubj
            - name: OMP_NUM_THREADS
              value: "1"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: 8080
            initialDelaySeconds: 5
            timeoutSeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: server-code
              mountPath: /app/src/server_inferencia_aula31.py
              subPath: server_inferencia_aula31.py
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: models-pvc-kubeflow
        - name: server-code
          configMap:
            name: fraude-serving-aula31-code

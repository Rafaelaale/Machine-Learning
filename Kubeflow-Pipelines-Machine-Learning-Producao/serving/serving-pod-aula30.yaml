apiVersion: v1
kind: Pod
metadata:
  name: serving-copia-20261108215247
  namespace: kubeflow
spec:
  restartPolicy: Never
  containers:
    - name: copy
      image: fraude-trainer:2.4
      imagePullPolicy: Never
      command: ["python", "-c"]
      args:
        - |
          from pathlib import Path
          import shutil
          import hashlib

          origem = Path("/models/aula26-20261108210412/model.ubj")
          destino = Path("/models/serving/aula26-20261108210412/model.ubj")

          if not origem.is_file() or origem.stat().st_size == 0:
              raise RuntimeError(f"Modelo ausente: {origem}")

          destino.parent.mkdir(parents=True, exist_ok=True)

          def hash_file(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()

          if destino.exists():
              if hash_file(origem) != hash_file(destino):
                  raise RuntimeError("Modelo existente diferente. Copia cancelada.")
              print("Modelo ja copiado e validado", flush=True)
          else:
              shutil.copy2(origem, destino)

          if hash_file(origem) != hash_file(destino):
              raise RuntimeError("Falha na integridade da copia")

          print(f"MODELO VALIDADO: {destino}", flush=True)
          print(f"TAMANHO: {destino.stat().st_size} bytes", flush=True)
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"
      volumeMounts:
        - name: models
          mountPath: /models
  volumes:
    - name: models
      persistentVolumeClaim:
        claimName: models-pvc-kubeflow

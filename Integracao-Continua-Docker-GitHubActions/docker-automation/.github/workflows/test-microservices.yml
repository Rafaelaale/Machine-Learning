name: Test Microservices

on:
  push:
    branches: [aula-01]
  pull_request:
    branches: [aula-01]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-microservices:
    name: Testar ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - order-service
          - product-service
          - user-service

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGO_URI: mongodb://127.0.0.1:27017/burguer_app_db
      SECRET_KEY: ci-test-only-key
      JWT_SECRET: ci-test-only-jwt

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        working-directory: ./burguer-app/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov radon

      - name: Executar testes e cobertura
        working-directory: ./burguer-app/${{ matrix.service }}
        run: |
          python -m pytest -v \
            --cov=models \
            --cov=services \
            --cov=config \
            --cov=controllers \
            --cov-report=term-missing

      - name: Analisar complexidade ciclomatica
        if: always()
        working-directory: ./burguer-app/${{ matrix.service }}
        run: |
          python -m radon cc models -s

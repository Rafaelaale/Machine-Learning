name: Deploy to ECS Fargate via Docker Hub - Rascunho

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: alura
  SERVICE_NAME: CONFIGURAR_SERVICO_ECS
  TASK_DEFINITION: microservice-task

jobs:
  deploy:
    if: ${{ false }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker images
        env:
          OWNER: ${{ secrets.DOCKER_USERNAME }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          for service in auth-service user-service order-service product-service; do
            image="${OWNER}/${service}:${SHA}"
            docker build -t "$image" "./burguer-app/$service"
            docker push "$image"
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS task definition and service
        env:
          OWNER: ${{ secrets.DOCKER_USERNAME }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION" \
            --query taskDefinition > task-current.json

          jq --arg owner "$OWNER" --arg sha "$SHA" '
            .containerDefinitions |= map(
              if (
                .name == "auth-service" or
                .name == "user-service" or
                .name == "order-service" or
                .name == "product-service"
              ) then
                .image = ("docker.io/" + $owner + "/" + .name + ":" + $sha)
              else
                .
              end
            )
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )
          ' task-current.json > task-updated.json

          TASK_ARN="$(aws ecs register-task-definition \
            --cli-input-json file://task-updated.json \
            --query taskDefinition.taskDefinitionArn \
            --output text)"

          aws ecs update-service \
            --cluster "$CLUSTER_NAME" \
            --service "$SERVICE_NAME" \
            --task-definition "$TASK_ARN"

          aws ecs wait services-stable \
            --cluster "$CLUSTER_NAME" \
            --services "$SERVICE_NAME"

name: Aula 218718 - Versionamento de imagens Docker - Rascunho

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versionamento:
    if: ${{ false }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Versionamento das imagens
        id: versionamento
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_SHA:0:7}"

          echo "IMAGE_TAG=${VERSION}" >> "$GITHUB_ENV"

          echo "Versao das imagens: ${VERSION}"

      - name: Build e versionamento dos microservicos
        shell: bash
        run: |
          set -euo pipefail

          for service in \
            auth-service \
            user-service \
            order-service \
            product-service
          do
            echo "Construindo ${service}:${IMAGE_TAG}"

            docker build \
              -t "burguer-app-${service}:${IMAGE_TAG}" \
              -t "burguer-app-${service}:latest" \
              "./burguer-app/${service}"

          done

      - name: Validar imagens versionadas
        shell: bash
        run: |
          set -euo pipefail

          for service in \
            auth-service \
            user-service \
            order-service \
            product-service
          do
            docker image inspect \
              "burguer-app-${service}:${IMAGE_TAG}" \
              > /dev/null

            echo "VALIDADO: burguer-app-${service}:${IMAGE_TAG}"
          done

      - name: List Docker images
        shell: bash
        run: |
          docker images
